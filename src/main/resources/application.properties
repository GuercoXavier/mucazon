spring.application.name=mucazon

#sql debug

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Apllication port
server.port=8080

#default connection pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasoource.hikari.maximumPoolSize=5

#Postgree SQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dev?currentSchema=users
spring.datasource.username=postgres
spring.datasource.password=xxxx
spring.datasource.schema=users

#default schema
spring.flyway.schemas=users
spring.jpa.properties.hibernate.default_schema=users

# FLYWAY (FlywayProperties)
spring.flyway.url =jdbc:postgresql://localhost:5432/dev
spring.flyway.user =postgres
spring.flyway.password =GRo10
